name: Collecte cinémas Koweït
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.mjs
        env:
          PREVIOUS_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Publier (branche gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
